
name: Daily GitHub Repository Maintainer

on:
  schedule:
    # 9:15 PM IST every day (15:45 UTC)
    - cron: "45 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-repository-maintainer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit all personal repositories
        uses: actions/github-script@v7
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        with:
          script: |
            const fs = require("fs");
            const { Octokit } = require("@octokit/rest");

            const token = process.env.REPO_READ_TOKEN;
            if (!token) {
              throw new Error("Missing REPO_READ_TOKEN secret.");
            }

            const reader = new Octokit({ auth: token });
            const me = await reader.rest.users.getAuthenticated();
            const owner = me.data.login;

            const repos = await reader.paginate(
              reader.rest.repos.listForAuthenticatedUser,
              {
                affiliation: "owner",
                visibility: "all",
                per_page: 100,
                sort: "updated",
                direction: "desc"
              }
            );

            // Only repositories personally owned by this account.
            const mine = repos.filter(
              r => r.owner.login.toLowerCase() === owner.toLowerCase()
            );

            if (mine.length === 0) {
              throw new Error(
                "No personal repositories found. Check token access."
              );
            }

            const now = new Date();
            const date = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Kolkata",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).format(now);

            const ageDays = d =>
              Math.floor((now - new Date(d)) / 86400000);

            const rows = mine.map(r => {
              const age = ageDays(r.pushed_at || r.updated_at);
              const flags = [];

              if (!r.description) flags.push("Add a description");
              if (r.archived) flags.push("Archived");
              if (!r.archived && age >= 90) {
                flags.push("No push in 90+ days");
              }

              return {
                name: r.name,
                url: r.html_url,
                visibility: r.private ? "Private" : "Public",
                branch: r.default_branch || "Unknown",
                lastPush: r.pushed_at
                  ? r.pushed_at.slice(0, 10)
                  : "No recorded push",
                stars: r.stargazers_count,
                flags
              };
            });

            rows.sort((a, b) => a.name.localeCompare(b.name));

            const table = rows.map(r =>
              `| [${r.name.replace(/\|/g, "\\|")}](${r.url}) | ${r.visibility} | ${r.branch} | ${r.lastPush} | ${r.stars} | ${r.flags.join(", ") || "No metadata flags"} |`
            );

            const report = [
              "# Daily Repository Health Report",
              "",
              `- Scan date: ${date} (India Standard Time)`,
              `- Account: [${owner}](https://github.com/${owner})`,
              `- Personal repositories scanned: ${mine.length}`,
              `- Repositories needing metadata attention: ${rows.filter(r => r.flags.some(f => f !== "Archived")).length}`,
              "",
              "This is a metadata audit, not a code-quality or security audit.",
              "",
              "| Repository | Visibility | Default branch | Last push | Stars | Observations |",
              "|---|---|---|---|---:|---|",
              ...table,
              "",
              "## Suggested next steps",
              "",
              "- Add useful descriptions to projects that need them.",
              "- Review inactive repositories and decide whether to maintain or archive them.",
              "- Add project-specific tests and CI checks where appropriate.",
              "- Review code changes before merging automated pull requests.",
              "",
              "_Generated automatically by GitHub Actions._",
              ""
            ].join("\n");

            fs.mkdirSync("reports", { recursive: true });
            fs.writeFileSync("reports/repo-health.md", report);

            core.summary
              .addHeading("Repository audit completed")
              .addRaw(`Scanned ${mine.length} personal repositories.`)
              .write();

      - name: Commit daily report
        env:
          GH_EMAIL: ${{ secrets.GH_COMMIT_EMAIL }}
        run: |
          git config user.name "akshau094"
          git config user.email "$GH_EMAIL"

          git add reports/repo-health.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily repository health report"
          git push
